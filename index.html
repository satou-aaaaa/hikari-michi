/* 夜の展示室：紺の地に、金色の光の筋。鏡は銀、ヒントの鏡は金、はじめからの鏡は青みの灰色 */
:root{

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-weight:500;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
.wrap{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 28px;display:flex;flex-direction:column;gap:12px;min-height:100%;box-sizing:border-box}

.icon{all:unset;cursor:pointer;font-size:18px;min-width:44px;height:44px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);box-sizing:border-box;padding:0 8px;background:var(--paper)}
.icon:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--beam);outline-offset:2px}
.dots{display:flex;gap:6px;flex:1;max-width:120px}
.dots i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--beam)}.dots i.done{background:var(--ink2)}
button.main,a.main{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:16px;background:var(--beam);color:#2a2205;font-weight:800;font-size:17px;padding:0 16px;text-align:center;box-shadow:0 4px 0 var(--beam2)}
button.main:active{transform:translateY(2px);box-shadow:0 2px 0 var(--beam2)}

button.sub,a.sub{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;border-radius:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);font-weight:800;font-size:15px;padding:0 12px;text-align:center}
button.sub:disabled{opacity:.4;cursor:default}
.row{display:flex;gap:10px}.row>.sub,.row>.main{flex:1 1 0}
.note{color:var(--ink2);font-size:13px;line-height:1.6;margin:0;text-align:center}
.note a{color:var(--beam);display:inline-flex;align-items:center;min-height:44px}
/* 部屋の盤 */
.ask{text-align:center;font-size:14px;font-weight:800;margin:0;color:var(--ink2)}
.board{background:#0e1222;border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 24px #0008 inset;touch-action:manipulation;user-select:none;-webkit-user-select:none;overflow:hidden}
.board svg{display:block;width:100%;height:auto}
.board .hit{fill:transparent;cursor:pointer}
.board .hit:focus-visible{outline:none;fill:#ffd45a22}
.board .beam{filter:drop-shadow(0 0 4px #ffd45a)}
.board.win .beam{stroke:#fff6c8}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:center;font-size:12px;color:var(--ink2)}

.big{font-weight:800;font-size:24px;text-align:center;margin:0}

.res .no{opacity:.45}
dialog{border:none;border-radius:18px;background:var(--paper);color:var(--ink);max-width:400px;width:calc(100% - 32px);padding:20px;box-sizing:border-box}
dialog::backdrop{background:#000000bb}
dialog h2{margin:0 0 10px;letter-spacing:.06em}
dialog ol{padding-left:1.3em;margin:0 0 12px;line-height:1.8}
dialog p{margin:0 0 10px;font-size:14px;line-height:1.7;color:var(--ink2)}
dialog a{color:var(--beam);min-height:44px;display:inline-flex;align-items:center}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#f3f5fb;color:#151a2e;padding:10px 16px;border-radius:12px;font-weight:800;z-index:9;box-shadow:0 6px 20px #0008;max-width:90%;text-align:center}
footer{margin-top:auto;text-align:center;font-size:12px;color:var(--ink2);display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
footer a{color:var(--ink2);min-height:44px;display:inline-flex;align-items:center}
.achs{display:flex;flex-direction:column;gap:8px}
.achs div{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.achs div.got{border-color:var(--gold);background:#2c2a20}
.achs b{font-size:15px}.achs div.got b{color:var(--gold)}
.achs small{font-size:12px;color:var(--ink2)}
.achs i{display:block;height:6px;border-radius:3px;background:linear-gradient(90deg,var(--go) var(--p),var(--line) var(--p))}
.newach{border:1px solid var(--gold);background:#2c2a20;font-weight:800;border-radius:14px;padding:12px;text-align:center;font-size:15px;line-height:1.6}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap" id="app"></div>
<dialog id="howto" aria-labelledby="howto-t">
  <h2 id="howto-t">遊び方</h2>
  <ol>
    <li>光は左の明かりから右へ進みます。</li>
    <li>ますを押すと鏡を置けます。押すたびに「／」→「＼」→なし。</li>
    <li>光が宝石を全部通って出口（緑の輪）から出たら「光を届ける」。</li>
  </ol>
  <p>鏡に当たった光は直角に曲がります。鏡は表と裏の両方で光を曲げます。岩に当たると光は止まり、宝石は光が通りぬけます。</p>
  <p>いちばん少ない鏡の数で届けてヒントも使わなければ★3つ。いちばん少ない数は問題の上に出ています。はじめからある鏡（灰色）は動かせません。</p>
  <p>今日の3問はだれでも同じで1日1回。時間制限はありません。</p>
  <p><a id="fb2" target="_blank" rel="noopener">感想を送る</a></p>
  <button class="main" id="howto-ok" style="width:100%">わかった</button>
</dialog>
<script src="gen.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id), app = $("app");
const SITE = "https://satou-aaaaa.github.io/hikari-michi/";
const FEEDBACK = "https://github.com/satou-aaaaa/hikari-michi/issues/new?template=feedback.yml";
const KEY = "hikari-michi-v1", EPOCH = "2026-11-05";
const T = window.HIK, LVS = [...T.SIZES, T.HARD];
const GEMC = ["#ff6b8a", "#5cc8ff", "#7ee08a", "#c592ff"];
const MIR = ["", "／", "＼"];

// ---- 日付と種（日本時間。だれでも同じ3問）----
const jstNow = () => new Date(Date.now() + 9 * 3600e3);
const todayKey = () => jstNow().toISOString().slice(0, 10);
const dayNo = (k) => Math.round((Date.parse(k) - Date.parse(EPOCH)) / 864e5) + 1;
// 今日の3問：小部屋・広間・大広間。上級：6×8の部屋を2つ（ヒントなし）
const dailyList = (k) => [0, 1, 2].map((lv) => ({ lv, seed: T.seedOf(k + ":d:" + lv) }));
const hardList = (k) => [0, 1].map((j) => ({ lv: 3, seed: T.seedOf(k + ":h:" + j) }));
const cache = new Map();
const probOf = (it) => { const id = it.lv + ":" + it.seed; if (!cache.has(id)) cache.set(id, T.make(it.seed, LVS[it.lv])); return cache.get(id); };
// ★：いちばん少ない鏡の数で3、2枚多いまで2、それより多いと1。ヒント1回ごとに1つ減らす（最低1）
const starsOf = (r) => Math.max(1, (r.m <= 0 ? 3 : r.m <= 2 ? 2 : 1) - (r.h || 0));
const starStr = (s) => `<span class="stars" aria-label="星${s}つ">${"★".repeat(s)}<span class="off">${"★".repeat(3 - s)}</span></span>`;

// ---- 記録（この端末の localStorage だけ）----
// 進行中の遊びはモードごとに分けて持つ（練習を始めても今日・上級の途中経過を消さない）。cnt・perf：大きさごとの通した数・いちばん少ない鏡で通した数
const fresh = () => ({ v: 1, days: {}, hdays: {}, cnt: {}, perf: {}, total: 0, runs: {}, tut: false, kofi: {}, ach: {} });
let MODE = "d";
let mem = null; // 保存できない環境では、開いているあいだだけここに置く
// 保存に失敗したあとはメモリと保存の両方を読む。記録（日ごとの結果・部屋帳）は合わせて数は高いほう、途中経過は同じ日・同じ問題なら進んだほう（同じだけ進んでいたらヒントの数は多いほう）
const doneOf = (r) => !!r && r.res.length >= r.list.length, recOf = (r) => ({ r: r.res.map((x) => ({ m: x.m, h: x.h })) });
// 終わった今日・上級の回を日ごとの記録に入れる（結果を見る前に別のタブが次の日を保存しても、終えた日を失わない）
function bank(s, r) { const b = doneOf(r) ? (r.mode === "d" ? s.days : r.mode === "h" ? s.hdays : null) : null; if (!b || b[r.date]) return false; b[r.date] = recOf(r); return true; }
// ヒントの鏡を合わせる：other にだけあるヒントのますを、その鏡ごと to に写し、ヒントの数は多いほう（ヒントの数だけ残って鏡が消えないように。2026-11-05 CodeRabbit）
// ヒントの鏡は2つまで（valid と同じ上限）。別のますのヒントを合わせたら、数もますの数に合わせる（2026-11-05 CodeRabbit）
function mergeHint(to, other) { if (!to || !other || !Array.isArray(other.hint) || !Array.isArray(to.hint) || !to.put || !other.put) return to; for (const h of other.hint) { if (to.hint.length >= 2) break; if (to.hint.some((x) => x[0] === h[0] && x[1] === h[1])) continue; const v = other.put[h[0]] && other.put[h[0]][h[1]]; if (!v || !to.put[h[0]]) continue; to.put[h[0]][h[1]] = v; to.hint.push([h[0], h[1]]); } to.hints = Math.min(2, Math.max(to.hints || 0, other.hints || 0, to.hint.length)); return to; }
function load() { let a = null, b = null; try { b = JSON.parse(localStorage.getItem(KEY)); } catch (e) {} try { a = mem !== null ? JSON.parse(mem) : null; } catch (e) {} if (a && a.v !== 1) a = null; if (b && b.v !== 1) b = null; if (!a || !b) return Object.assign(fresh(), a || b || {}); const [n, o] = (a.t || 0) >= (b.t || 0) ? [a, b] : [b, a]; const s = Object.assign(fresh(), n); for (const k in o) { if (k === "runs" || k === "t") continue; const x = o[k], y = n[k]; if (x && y && typeof x === "object" && typeof y === "object") { s[k] = Object.assign({}, x, y); for (const q in x) if (typeof x[q] === "number" && typeof y[q] === "number") s[k][q] = Math.max(x[q], y[q]); } else if (typeof x === "number" && typeof y === "number") s[k] = Math.max(x, y); else if (x === true) s[k] = true; } const ra = a.runs || {}, rb = b.runs || {}, prog = (r) => (r.res ? r.res.length : 0) * 1e6 + (r.cur && r.cur.moves ? r.cur.moves : 0), idOf = (r) => JSON.stringify([r.list || null, r.id || null]); s.runs = Object.assign({}, n.runs); for (const m of new Set([...Object.keys(ra), ...Object.keys(rb)])) { const x = ra[m], y = rb[m]; if (x === undefined || y === undefined) { if (x || y) s.runs[m] = x || y; continue; } if (!x || !y) { const r = x || y; if (!r || bank(s, r) || doneOf(r)) continue; const bd = r.mode === "d" ? s.days : r.mode === "h" ? s.hdays : null; if (bd && !bd[r.date]) s.runs[m] = r; continue; } if (x.date !== y.date) { const [w, l] = x.date > y.date ? [x, y] : [y, x]; bank(s, l); s.runs[m] = w; } else if (idOf(x) === idOf(y)) { const px = prog(x), py = prog(y); s.runs[m] = px > py ? x : py > px ? y : n.runs[m]; if (x.cur && y.cur && x.cur.i === y.cur.i) { const w = s.runs[m], l = w === x ? y : x; s.runs[m] = Object.assign({}, w, { cur: mergeHint(JSON.parse(JSON.stringify(w.cur)), l.cur) }); } } } return s; }
// 保存の前に読み直す（別のタブで進めた記録を消さない）
function save(fn) { const s = load(); fn(s); s.t = Math.max(Date.now(), (s.t || 0) + 1); const j = JSON.stringify(s); try { localStorage.setItem(KEY, j); mem = null; } catch (e) { mem = j; } return s; }
const prevDay = (k) => new Date(Date.parse(k) - 864e5).toISOString().slice(0, 10);
function streak(days) { let k = todayKey(), n = 0; if (!days[k]) k = prevDay(k); while (days[k]) { n++; k = prevDay(k); } return n; }
const RANKS = [[0, "見習い"], [10, "光の案内人"], [40, "鏡の職人"], [120, "光の名人"], [300, "伝説の鏡師"]];
const rankOf = (n) => RANKS.filter((r) => n >= r[0]).pop()[1];
const nextRank = (n) => RANKS.find((r) => r[0] > n);
// 実績：腕前（ぴったり・ヒントなし・上級）は今日の3問と上級の記録だけで数え、練習は部屋帳の数にだけ入る
const one = (r) => r.m <= 0 && !r.h;
function maxStreak(days) { const ks = Object.keys(days).sort(); let best = 0, run = 0, prev = null; for (const k of ks) { run = prev && Date.parse(k) - Date.parse(prev) === 864e5 ? run + 1 : 1; best = Math.max(best, run); prev = k; } return best; }
function achList(s) {
  const okR = (x) => x && Array.isArray(x.r) && x.r.every((r) => r && typeof r.m === "number"), D = Object.values(s.days).filter(okR), H = Object.values(s.hdays).filter(okR), all = D.concat(H).flatMap((x) => x.r);
  return [
    ["はじめての光", "光を1回届ける", s.total, 1],
    ["ぴったりの感覚", "今日の3問・上級で、いちばん少ない鏡（ヒントなし）を10回", all.filter(one).length, 10],
    ["ぴったり名人", "今日の3問・上級で、いちばん少ない鏡（ヒントなし）を50回", all.filter(one).length, 50],
    ["三つともぴったり", "今日の3問を全部いちばん少ない鏡で終える", D.filter((x) => x.r.every(one)).length, 1],
    ["ヒントなしの一週間", "ヒントを使わずに今日の3問を終えた日が7日", D.filter((x) => x.r.every((r) => !r.h)).length, 7],
    ["上級に挑む", "上級を終える", H.length, 1],
    ["上級の鏡師", "上級の2つともいちばん少ない鏡で届ける", H.filter((x) => x.r.length >= 2 && x.r.every(one)).length, 1],
    ["三日つづけて", "3日続けて今日の3問を終える", maxStreak(s.days), 3],
    ["一週間つづけて", "7日続けて今日の3問を終える", maxStreak(s.days), 7],
    ["大広間の達人", "大広間をいちばん少ない鏡で20回（練習も数える）", s.perf[2] || 0, 20],
    ["百の部屋", "光を100回届ける", s.total, 100],
  ].map(([name, desc, cur, goal]) => ({ name, desc, cur: Math.min(cur, goal), goal, done: cur >= goal }));
}
const achDone = (s) => achList(s).filter((a) => a.done).map((a) => a.name);

// ---- 画面 ----
const md = (k) => `${+k.slice(5, 7)}/${+k.slice(8, 10)}`;
function toast(t) { const d = document.createElement("div"); d.className = "toast"; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), 1800); }
const buzz = (n = 12) => { try { navigator.vibrate && navigator.vibrate(n); } catch (e) {} };
const esc = (t) => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;");
const footer = () => `<footer><a href="#" id="f-how">遊び方</a><a href="#" data-hk>引き継ぎ</a><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a><a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi で応援</a></footer>`;
function bindFooter() { const h = $("f-how"); if (h) h.onclick = (e) => { e.preventDefault(); openHow(); }; }
function openHow() { $("fb2").href = FEEDBACK; const d = $("howto"); if (d.showModal) d.showModal(); else d.setAttribute("open", ""); }
$("howto-ok").onclick = () => { const d = $("howto"); d.close ? d.close() : d.removeAttribute("open"); save((s) => { s.tut = true; }); };
// ホームの小さな部屋（飾り）：光が鏡で2回曲がって宝石を通り、出口へ

  result(run.mode, run.date, first, undefined, fresh);
}
// 共有の文：部屋（答え）は出さない。いちばん少ない鏡🟩・2枚多いまで🟨・それ以上🟧、ヒントを使ったら💡
const sq = (r) => (r.h ? "💡" : r.m <= 0 ? "🟩" : r.m <= 2 ? "🟨" : "🟧");
function shareText(mode, k, rec) {
  const all = rec.r.every(one);
  return `ひかり道${mode === "h" ? " 上級" : ""} #${dayNo(k)} ${md(k)}\n${rec.r.map(sq).join("")}${all ? " 全部ぴったり" : ""}`;
}
function untilNext() { const n = jstNow(), ms = 864e5 - (n.getTime() % 864e5); return `${Math.floor(ms / 36e5)}時間${Math.floor((ms % 36e5) / 6e4)}分`; }
function result(mode, k, first, prec, fresh) {
  const s = load();
  const list = mode === "p" ? prec.list : mode === "d" ? dailyList(k) : hardList(k);
  const rec = mode === "p" ? prec : (mode === "d" ? s.days : s.hdays)[k];
  if (!rec) return home();
  const all = rec.r.every(one), text = shareText(mode, k, rec);
  const showKofi = first && mode !== "p" && all && !s.kofi[k + mode];
  if (showKofi) save((s2) => { s2.kofi[k + mode] = 1; });
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>ひかり道<small>${mode === "d" ? `今日の3問 #${dayNo(k)}` : mode === "h" ? "上級" : "練習"}</small></h1><span></span></header>
    <p class="big">${all ? "全部、いちばん少ない鏡で届けた！" : `${list.length}つの部屋に光を届けた`}</p>
    ${fresh && fresh.length ? `<div class="newach">新しい実績：${fresh.map(esc).join("・")}</div>` : ""}
    <div class="res">${list.map((it, j) => { const p = probOf(it), r = rec.r[j]; return `<div><span>${esc(p.name)}（${p.W}×${p.H}）<br><small style="color:var(--ink2)">鏡${p.d + r.m}枚／いちばん少ないと${p.d}枚${r.h ? `・ヒント${r.h}` : ""}</small></span>${starStr(starsOf(r))}</div>`; }).join("")}</div>
    ${mode !== "p" ? `<div class="share">${esc(text)}</div>
    <button class="main" id="share">結果をシェア</button>
    <div class="shares"><a id="toX" target="_blank" rel="noopener">Xで投稿</a><a id="toLine" target="_blank" rel="noopener">LINEで送る</a><button id="copy">コピー</button></div>
    <p class="note">🟩いちばん少ない鏡　🟨2枚多いまで　🟧もっと　💡ヒント<br>次の3問まで あと <b>${untilNext()}</b></p>` : ""}
    ${mode === "d" && k === todayKey() && !s.hdays[k] ? `<button class="main alt" id="go-h">上級：6×8の部屋に挑む</button>` : ""}
    <div class="row"><button class="sub" id="go-p">練習する</button><button class="sub" id="go-dex">部屋帳を見る</button></div>
    ${showKofi ? `<p class="note kofi">楽しめたら、<a href="https://ko-fi.com/satouaaaaa" target="_blank" rel="noopener">Ko-fi でコーヒー1杯の応援</a>をもらえると、新しいゲームづくりの励みになります（任意・遊ぶのはずっと無料）。</p>` : ""}
    <p class="note"><a href="${FEEDBACK}" target="_blank" rel="noopener">感想を送る</a></p>`;
  $("back").onclick = home;
  $("go-p").onclick = practiceMenu;
  $("go-dex").onclick = dex;
  if ($("go-h")) $("go-h").onclick = () => (k === todayKey() ? startRun("h") : home()); // 画面を開いたまま0時を過ぎたら、翌日の上級は始めない
  if (mode !== "p") {
    const withUrl = text + "\n" + SITE;
    $("toX").href = "https://twitter.com/intent/tweet?text=" + encodeURIComponent(withUrl);
    $("toLine").href = "https://line.me/R/share?text=" + encodeURIComponent(withUrl);
    const copy = (t) => { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("コピーしました"), () => toast("コピーできませんでした")); };
    $("copy").onclick = () => copy(withUrl);
    $("share").onclick = () => { if (navigator.share) navigator.share({ text: withUrl }).catch(() => {}); else copy(withUrl); };
  }
}

// 実績：取れたものと、まだのものの進み具合
function ach() {
  const L = achList(load());
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>実績<small>${L.filter((a) => a.done).length}/${L.length}</small></h1><span></span></header>
    <div class="achs">${L.map((a) => `<div class="${a.done ? "got" : ""}"><b>${a.done ? "★" : "☆"} ${esc(a.name)}</b><small>${esc(a.desc)}</small>${a.done ? "" : `<i style="--p:${Math.round((a.cur / a.goal) * 100)}%"></i><small>${a.cur}/${a.goal}</small>`}</div>`).join("")}</div>
    ${footer()}`;
  $("back").onclick = home;
  bindFooter();
}
// 部屋帳：大きさごとの、通した数といちばん少ない鏡で通した数
function dex() {
  const s = load();
  app.innerHTML = `
    <header><button class="icon" id="back" aria-label="ホームへ">←</button><h1>部屋帳<small>通した部屋 ${s.total}室</small></h1><span></span></header>
    <p class="note">部屋の大きさごとに、通した数と、いちばん少ない鏡（ヒントなし）で通した数です。練習も数えます。</p>
    <div class="res">${LVS.map((L, lv) => { const n = s.cnt[lv] || 0, q = s.perf[lv] || 0; return `<div class="${n ? "" : "no"}"><span>${esc(L.name)}（${L.W}×${L.H}）<br><small style="color:var(--ink2)">ぴったり ${q}回${n ? `（${Math.round((q / n) * 100)}%）` : ""}</small></span><b>${n}室</b></div>`; }).join("")}</div>
    ${footer()}`;
  $("back").onclick = home;
  bindFooter();
}

window.__hk = { achList, maxStreak, mode: () => MODE, T, LVS, dailyList, hardList, probOf, starsOf, todayKey, dayNo, shareText, streak, load, valid, cur: () => cur, toggle: (r, c) => toggle(r, c), deliver: () => deliver(), hint: () => hint(), play: (m) => { if (m) MODE = m; play(); } };
home();
if ("serviceWorker" in navigator && location.protocol === "https:" && /github\.io$/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
